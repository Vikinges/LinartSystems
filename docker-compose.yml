version: '3.8'
services:
  reverse-proxy:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=vladimir@lsc-led.de
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  hub:
    build: ./hub
    depends_on:
      - service2
    ports:
      - "${HUB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      # HTTPS
      - traefik.http.routers.linart.rule=Host(`lsc-led.de`)
      - traefik.http.routers.linart.entrypoints=websecure
      - traefik.http.routers.linart.tls=true
      - traefik.http.routers.linart.tls.certresolver=letsencrypt
      - traefik.http.services.linart.loadbalancer.server.port=8080
      # HTTP → HTTPS redirect
      - traefik.http.routers.linart-http.rule=Host(`lsc-led.de`)
      - traefik.http.routers.linart-http.entrypoints=web
      - traefik.http.routers.linart-http.middlewares=https-redirect
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - HUB_ADMIN_PASSWORD=${HUB_ADMIN_PASSWORD:?HUB_ADMIN_PASSWORD is required}
      - HUB_ADMIN_PASSWORD_FORCE=${HUB_ADMIN_PASSWORD_FORCE:-}
      - HUB_DATA_DIR=/app/data
    volumes:
      - hub-data:/app/data
      - hub-uploads:/app/static/uploads

  service2:
    build: ./service2
    depends_on:
      - paddle-ocr
    restart: always
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PADDLE_OCR_URL=${PADDLE_OCR_URL:-http://paddle-ocr:8866/ocr}
      - SIGN_SERVICE_URL=${SIGN_SERVICE_URL:-http://service-sign:3002}
      - SIGN_INTERNAL_TOKEN=${SIGN_INTERNAL_TOKEN:-}
      - SIGN_SHARED_DIR=/app/sign
    volumes:
      - ./service2/out:/app/out
      - sign-data:/app/sign
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  service-sign:
    build: ./service-sign
    restart: always
    environment:
      - SIGN_INTERNAL_TOKEN=${SIGN_INTERNAL_TOKEN:-}
      - SIGN_SHARED_DIR=/app/sign
      - PUBLIC_SIGN_BASE_URL=${PUBLIC_SIGN_BASE_URL:-https://sign.lsc-led.de/}
    volumes:
      - sign-data:/app/sign
    labels:
      - traefik.enable=true
      # HTTPS
      - traefik.http.routers.sign.rule=Host(`sign.lsc-led.de`)
      - traefik.http.routers.sign.entrypoints=websecure
      - traefik.http.routers.sign.tls=true
      - traefik.http.routers.sign.tls.certresolver=letsencrypt
      - traefik.http.services.sign.loadbalancer.server.port=3002
      # HTTP → HTTPS redirect
      - traefik.http.routers.sign-http.rule=Host(`sign.lsc-led.de`)
      - traefik.http.routers.sign-http.entrypoints=web
      - traefik.http.routers.sign-http.middlewares=sign-https-redirect
      - traefik.http.middlewares.sign-https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.sign-https-redirect.redirectscheme.permanent=true

  paddle-ocr:
    image: 987846/paddleocr:latest
    restart: always
    environment:
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    ports:
      - "8866:8866"

volumes:
  hub-data:
  hub-uploads:
  sign-data:
