version: '3.8'
services:
  reverse-proxy:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=vladimir@linart.club
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  hub:
    build: ./hub
    depends_on:
      - service2
      - service-sign
    ports:
      - "${HUB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.linart.rule=Host(`lsc-led.de`)
      - traefik.http.routers.linart.entrypoints=websecure
      - traefik.http.routers.linart.tls=true
      - traefik.http.routers.linart.tls.certresolver=letsencrypt
      - traefik.http.services.linart.loadbalancer.server.port=8080
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - HUB_ADMIN_PASSWORD=${HUB_ADMIN_PASSWORD:?HUB_ADMIN_PASSWORD is required}
      - HUB_ADMIN_PASSWORD_FORCE=${HUB_ADMIN_PASSWORD_FORCE:-}
      - HUB_DATA_DIR=/app/data
      # APNs push (P3) — set these in the prod .env / Portainer stack env to enable push.
      - APNS_KEY_ID=${APNS_KEY_ID:-}
      - APNS_TEAM_ID=${APNS_TEAM_ID:-}
      - APNS_BUNDLE_ID=${APNS_BUNDLE_ID:-}
      - APNS_ENV=${APNS_ENV:-production}
      - APNS_KEY_P8_BASE64=${APNS_KEY_P8_BASE64:-}
      # Shared secret for service2 -> hub internal notify (submit-failure push to admins).
      - HUB_INTERNAL_TOKEN=${HUB_INTERNAL_TOKEN:-}
      # AI Assistant chat-bot (LinArt AI Consultant). Defaults target the LSC LED tenant.
      - AI_ASSISTANT_URL=${AI_ASSISTANT_URL:-https://ai.crm-iot.com}
      - AI_ASSISTANT_CLIENT_ID=${AI_ASSISTANT_CLIENT_ID:-31}
      - AI_ASSISTANT_ORIGIN=${AI_ASSISTANT_ORIGIN:-https://lsc-led.de}
      - AI_ASSISTANT_ENABLED=${AI_ASSISTANT_ENABLED:-true}
    volumes:
      - hub-data:/app/data
      - hub-uploads:/app/static/uploads

  service2:
    build: ./service2
    depends_on:
      - paddle-ocr
    restart: always
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PADDLE_OCR_URL=${PADDLE_OCR_URL:-http://paddle-ocr:8866/ocr}
      - SIGN_SERVICE_URL=${SIGN_SERVICE_URL:-http://service-sign:3002}
      - SIGN_INTERNAL_TOKEN=${SIGN_INTERNAL_TOKEN:-}
      - SIGN_SHARED_DIR=/app/sign
      # service2 -> hub internal notify (submit-failure push). Both must match the hub's.
      - HUB_URL=${HUB_URL:-http://hub:8080}
      - HUB_INTERNAL_TOKEN=${HUB_INTERNAL_TOKEN:-}
    volumes:
      - ./service2/data:/app/data
      - ./service2/public/templates:/app/public/templates
      - ./service2/out:/app/out
      - sign-data:/app/sign
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  service-sign:
    build: ./service-sign
    restart: always
    environment:
      - SIGN_INTERNAL_TOKEN=${SIGN_INTERNAL_TOKEN:-}
      - SIGN_SHARED_DIR=/app/sign
      - PUBLIC_SIGN_BASE_URL=https://lsc-led.de/sign
      - BASE_PATH=/sign
      # Remote-sign completion callback target (draw signature into the report box).
      - SERVICE2_URL=${SERVICE2_URL:-http://service2:3001}
    volumes:
      - sign-data:/app/sign

  paddle-ocr:
    image: 987846/paddleocr:latest
    restart: always
    environment:
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    ports:
      - "8866:8866"

volumes:
  hub-data:
  hub-uploads:
  sign-data:
