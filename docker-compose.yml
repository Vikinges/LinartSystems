version: '3.8'
services:
  reverse-proxy:
    image: traefik:v2.11
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      # ACME disabled; Cloudflare tunnel terminates TLS upstream.
    ports:
      - "80:80"
    volumes:
      - ./traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  hub:
    build: ./hub
    depends_on:
      - service2
    ports:
      - "${HUB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.linart.rule=Host(`hub.linart.club`)
      - traefik.http.routers.linart.entrypoints=web
      - traefik.http.services.linart.loadbalancer.server.port=8080
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET is required}
      - HUB_ADMIN_PASSWORD=${HUB_ADMIN_PASSWORD:?HUB_ADMIN_PASSWORD is required}
      - HUB_DATA_DIR=/app/data
    volumes:
      - hub-data:/app/data
      - hub-uploads:/app/static/uploads

  service2:
    build: ./service2
    depends_on:
      - paddle-ocr
    restart: always
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - PADDLE_OCR_URL=${PADDLE_OCR_URL:-http://paddle-ocr:8866/ocr}
    volumes:
      - ./service2/data:/app/data
      - ./service2/public/form-template1.pdf:/app/public/form-template1.pdf:ro
      - ./service2/public/templates:/app/public/templates
      - ./service2/out:/app/out
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  paddle-ocr:
    image: 987846/paddleocr:latest
    restart: always
    environment:
      - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
    ports:
      - "8866:8866"

volumes:
  hub-data:
  hub-uploads:
