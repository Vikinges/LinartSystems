<!doctype html>
<html lang="en-GB">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF files archive</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5fb;
      color: #1c1c1e;
      --control-scale: 1;
      --base-font-size: 16px;
      --accent: #1f3bf5;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --border: #d8d8e5;
      --text-muted: #475569;
    }

    body {
      margin: 0;
      padding: 1.5rem;
      font-size: var(--base-font-size);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
    }

    header {
      background: var(--surface);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 {
      margin: 0;
      font-size: 1.75rem;
    }

    header p {
      margin: 0;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .header-actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .header-meta {
      margin-top: 0.4rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background: var(--surface);
      padding: 1.5rem;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card h2 {
      margin: 0;
      font-size: 1.3rem;
      color: #1f2a5b;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      font-weight: 600;
    }

    .field>span {
      color: #2f2f37;
    }

    input[type="text"],
    input[type="search"],
    input[type="date"],
    select {
      font: inherit;
      font-size: calc(1rem * var(--control-scale, 1));
      padding: calc(0.75rem * var(--control-scale, 1));
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
    }

    .grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    }

    .field-wide {
      grid-column: span 2;
    }

    .button,
    .button:visited {
      border: none;
      background: var(--accent);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }

    .button.secondary {
      background: #e2e8f0;
      color: #1e293b;
    }

    .button.ghost {
      background: transparent;
      color: #1e293b;
      border: 1px solid var(--border);
    }

    .button.small {
      padding: 0.45rem 0.8rem;
      font-size: 0.85rem;
    }

    .filters-actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .admin-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .admin-actions[hidden] {
      display: none;
    }

    .admin-actions-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
    }

    .files-table:not(.is-admin) .col-select {
      display: none;
    }

    thead {
      background: var(--surface-muted);
    }

    th,
    td {
      padding: 0.85rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    th {
      font-weight: 700;
      color: #1f2a5b;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .status {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .status.error {
      color: #b91c1c;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #e0ecff;
      color: #1e3a8a;
      font-weight: 600;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-size: 0.85rem;
    }

    .empty {
      padding: 1rem;
      text-align: center;
      color: var(--text-muted);
    }

    .row-actions {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      align-items: flex-start;
    }

    .row-ttl {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .row-ttl select {
      font: inherit;
      font-size: 0.85rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .row-link-input {
      width: 100%;
      min-width: 220px;
      font: inherit;
      font-size: 0.85rem;
      padding: 0.35rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: white;
    }

    .row-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    @media (max-width: 720px) {
      body {
        padding: 1rem;
      }

      .field-wide {
        grid-column: span 1;
      }

      .header-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="header-row">
        <div>
          <h1>PDF files archive</h1>
          <p>Browse generated reports. Daily reports show project number, date, and submitter.</p>
          <div class="header-meta" id="user-meta"></div>
          <div class="header-meta" id="version-meta"></div>
        </div>
        <div class="header-actions">
          <a class="button secondary" href="./">Open form</a>
          <button class="button" type="button" id="refresh">Refresh</button>
        </div>
      </div>
    </header>

    <section class="card">
      <h2>Filters</h2>
      <form id="filters">
        <div class="grid">
          <label class="field">
            <span>Type</span>
            <select id="filter-type">
              <option value="">All types</option>
            </select>
          </label>
          <label class="field">
            <span>Project number</span>
            <input id="filter-project" type="text" placeholder="Project number" />
          </label>
          <label class="field">
            <span>Report date</span>
            <input id="filter-date" type="date" />
          </label>
          <label class="field">
            <span>Filled by</span>
            <input id="filter-submitter" type="text" placeholder="Submitter name" />
          </label>
          <label class="field field-wide">
            <span>Search</span>
            <input id="filter-query" type="search" placeholder="File name, template, project, submitter" />
          </label>
          <label class="field">
            <span>Limit</span>
            <select id="filter-limit">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200" selected>200</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
          </label>
        </div>
        <div class="filters-actions">
          <button class="button" type="submit">Apply</button>
          <button class="button ghost" type="button" id="clear">Clear</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="header-row">
        <h2>Files</h2>
        <div class="badge" id="results-count">0 files</div>
      </div>
      <div id="admin-actions" class="admin-actions" hidden>
        <div class="admin-actions-group">
          <span class="badge" id="selected-count">0 selected</span>
          <button class="button secondary" type="button" id="select-all">Select all</button>
          <button class="button ghost" type="button" id="clear-selection">Clear</button>
        </div>
        <div class="admin-actions-group">
          <button class="button secondary" type="button" id="download-zip" disabled>Download zip</button>
          <button class="button" type="button" id="delete-files" disabled>Delete</button>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="table-wrap">
        <table id="files-table" class="files-table">
          <thead>
            <tr>
              <th class="col-select">
                <input type="checkbox" id="select-all-checkbox" />
              </th>
              <th>Type</th>
              <th>Project</th>
              <th>Report date</th>
              <th>Filled by</th>
              <th>Created</th>
              <th>Template</th>
              <th>File</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="files-body">
            <tr>
              <td colspan="9" class="empty">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const appBaseUrl = new URL('.', window.location.href);
      const buildAppUrl = (path) => {
        const normalized = (path || '').replace(/^\/+/, '');
        return new URL(normalized || '.', appBaseUrl).toString();
      };

      const ADMIN_TOKEN_KEY = 'pm-admin-token';
      const readAdminToken = () => {
        try {
          return window.localStorage.getItem(ADMIN_TOKEN_KEY) || '';
        } catch (err) {
          return '';
        }
      };
      const fetchWithAdminToken = (path, options = {}) => {
        const token = readAdminToken();
        if (!token) {
          return fetch(buildAppUrl(path), options);
        }
        const headers = new Headers(options.headers || {});
        headers.set('Authorization', `Bearer ${token}`);
        return fetch(buildAppUrl(path), { ...options, headers });
      };

      const APP_VERSION = '0.54';
      const versionMetaEl = document.getElementById('version-meta');
      if (versionMetaEl) {
        versionMetaEl.textContent = `Version ${APP_VERSION}`;
      }
      const filtersForm = document.getElementById('filters');
      const typeSelect = document.getElementById('filter-type');
      const projectInput = document.getElementById('filter-project');
      const dateInput = document.getElementById('filter-date');
      const submitterInput = document.getElementById('filter-submitter');
      const queryInput = document.getElementById('filter-query');
      const limitSelect = document.getElementById('filter-limit');
      const refreshBtn = document.getElementById('refresh');
      const clearBtn = document.getElementById('clear');
      const statusEl = document.getElementById('status');
      const resultsCountEl = document.getElementById('results-count');
      const tbody = document.getElementById('files-body');
      const userMetaEl = document.getElementById('user-meta');
      const adminActionsEl = document.getElementById('admin-actions');
      const selectedCountEl = document.getElementById('selected-count');
      const selectAllBtn = document.getElementById('select-all');
      const clearSelectionBtn = document.getElementById('clear-selection');
      const downloadZipBtn = document.getElementById('download-zip');
      const deleteFilesBtn = document.getElementById('delete-files');
      const selectAllCheckbox = document.getElementById('select-all-checkbox');
      const filesTable = document.getElementById('files-table');

      let isAdmin = false;
      let canDeleteFiles = false;
      let canGenerateLinks = false;
      let currentFiles = [];
      let selectedKeys = new Set();

      const params = new URLSearchParams(window.location.search);
      if (params.has('type')) typeSelect.value = params.get('type');
      if (params.has('project')) projectInput.value = params.get('project');
      if (params.has('date')) dateInput.value = params.get('date');
      if (params.has('submitter')) submitterInput.value = params.get('submitter');
      if (params.has('q')) queryInput.value = params.get('q');
      if (params.has('limit')) limitSelect.value = params.get('limit');

      const formatDate = (value) => {
        if (!value) return '-';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString();
      };

      const setStatus = (message, isError = false) => {
        statusEl.textContent = message || '';
        statusEl.classList.toggle('error', Boolean(isError));
      };

      const copyText = async (text, fallbackInput) => {
        if (!text) return false;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch (err) {
            // fallback to input selection
          }
        }
        if (fallbackInput) {
          fallbackInput.focus();
          fallbackInput.select();
          try {
            const ok = document.execCommand('copy');
            fallbackInput.blur();
            return ok;
          } catch (err) {
            fallbackInput.blur();
            return false;
          }
        }
        return false;
      };

      const updateQuery = (filters) => {
        const next = new URLSearchParams();
        if (filters.type) next.set('type', filters.type);
        if (filters.project) next.set('project', filters.project);
        if (filters.date) next.set('date', filters.date);
        if (filters.submitter) next.set('submitter', filters.submitter);
        if (filters.q) next.set('q', filters.q);
        if (filters.limit && filters.limit !== '200') next.set('limit', filters.limit);
        const url = next.toString() ? `?${next.toString()}` : window.location.pathname;
        window.history.replaceState(null, '', url);
      };

      const readFilters = () => ({
        type: typeSelect.value.trim(),
        project: projectInput.value.trim(),
        date: dateInput.value.trim(),
        submitter: submitterInput.value.trim(),
        q: queryInput.value.trim(),
        limit: limitSelect.value.trim(),
      });

      const fileKey = (file) => `${file.templateType}::${file.filename}`;

      const updateSelectionUI = () => {
        const count = selectedKeys.size;
        if (selectedCountEl) {
          selectedCountEl.textContent = `${count} selected`;
        }
        const hasSelection = count > 0;
        if (downloadZipBtn) downloadZipBtn.disabled = !hasSelection;
        if (deleteFilesBtn) deleteFilesBtn.disabled = !hasSelection;
        if (clearSelectionBtn) clearSelectionBtn.disabled = !hasSelection;
        if (selectAllCheckbox) {
          selectAllCheckbox.checked = Boolean(currentFiles.length) && count === currentFiles.length;
        }
      };

      const renderRows = (files) => {
        currentFiles = Array.isArray(files) ? files : [];
        const keysInView = new Set(currentFiles.map(fileKey));
        selectedKeys.forEach((key) => {
          if (!keysInView.has(key)) {
            selectedKeys.delete(key);
          }
        });
        updateSelectionUI();

        tbody.innerHTML = '';
        if (!currentFiles.length) {
          const row = document.createElement('tr');
          const cell = document.createElement('td');
          cell.colSpan = 9;
          cell.className = 'empty';
          cell.textContent = 'No files found.';
          row.appendChild(cell);
          tbody.appendChild(row);
          return;
        }

        currentFiles.forEach((file) => {
          const row = document.createElement('tr');
          const daily = file.dailyReport || {};
          const key = fileKey(file);

          const selectCell = document.createElement('td');
          selectCell.className = 'col-select';
          if (canDeleteFiles) {
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = selectedKeys.has(key);
            checkbox.addEventListener('change', () => {
              if (checkbox.checked) {
                selectedKeys.add(key);
              } else {
                selectedKeys.delete(key);
              }
              updateSelectionUI();
            });
            selectCell.appendChild(checkbox);
          }
          row.appendChild(selectCell);

          const cells = [
            file.templateType || '-',
            daily.projectNumber || '-',
            daily.reportDate || '-',
            daily.submitterName || '-',
            formatDate(file.createdAt),
            file.templateLabel || '-',
          ];

          cells.forEach((value) => {
            const td = document.createElement('td');
            td.textContent = value || '-';
            row.appendChild(td);
          });

          const linkCell = document.createElement('td');
          const link = document.createElement('a');
          link.href = buildAppUrl(file.downloadPath || '');
          link.textContent = file.filename || 'Download';
          linkCell.appendChild(link);
          row.appendChild(linkCell);

          const actionsCell = document.createElement('td');
          if (canGenerateLinks) {
            const actionsWrap = document.createElement('div');
            actionsWrap.className = 'row-actions';

            const ttlWrap = document.createElement('div');
            ttlWrap.className = 'row-ttl';
            const ttlLabel = document.createElement('span');
            ttlLabel.textContent = 'TTL days';
            const ttlSelect = document.createElement('select');
            for (let day = 1; day <= 7; day += 1) {
              const option = document.createElement('option');
              option.value = String(day);
              option.textContent = String(day);
              if (day === 7) option.selected = true;
              ttlSelect.appendChild(option);
            }
            ttlWrap.appendChild(ttlLabel);
            ttlWrap.appendChild(ttlSelect);

            const signBtn = document.createElement('button');
            signBtn.type = 'button';
            signBtn.className = 'button ghost small';
            signBtn.textContent = 'Create sign link';

            const linkInput = document.createElement('input');
            linkInput.type = 'text';
            linkInput.readOnly = true;
            linkInput.className = 'row-link-input';
            linkInput.hidden = true;

            const pinLabel = document.createElement('span');
            pinLabel.style.fontWeight = 'bold';
            pinLabel.style.marginLeft = '0.5rem';
            pinLabel.hidden = true;

            const copyBtn = document.createElement('button');
            copyBtn.type = 'button';
            copyBtn.className = 'button secondary small';
            copyBtn.textContent = 'Copy link';
            copyBtn.hidden = true;

            const openBtn = document.createElement('a');
            openBtn.className = 'button secondary small';
            openBtn.textContent = 'Open link';
            openBtn.target = '_blank';
            openBtn.rel = 'noopener';
            openBtn.hidden = true;

            const meta = document.createElement('div');
            meta.className = 'row-meta';
            meta.hidden = true;

            const rowStatus = document.createElement('div');
            rowStatus.className = 'status';

            const setRowStatus = (message, isError = false) => {
              rowStatus.textContent = message || '';
              rowStatus.classList.toggle('error', Boolean(isError));
            };

            signBtn.addEventListener('click', async () => {
              signBtn.disabled = true;
              setRowStatus('Creating link...');
              try {
                const response = await fetchWithAdminToken('api/sign/create', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    type: file.templateType,
                    file: file.filename,
                    expiresInDays: Number(ttlSelect.value || '7'),
                  }),
                  credentials: 'same-origin',
                });
                const payload = await response.json().catch(() => ({}));
                if (!response.ok || !payload.ok) {
                  throw new Error(payload && payload.error ? payload.error : 'Unable to create link.');
                }
                const linkValue = payload.url || '';
                linkInput.value = linkValue;
                linkInput.hidden = false;
                pinLabel.textContent = `PIN: ${payload.pin || ''}`;
                pinLabel.hidden = !payload.pin;
                copyBtn.hidden = false;
                openBtn.href = linkValue || '#';
                openBtn.hidden = !linkValue;
                meta.textContent = payload.expiresAt ? `Expires ${formatDate(payload.expiresAt)}` : '';
                meta.hidden = !meta.textContent;
                setRowStatus('Link ready.');
              } catch (err) {
                setRowStatus(err && err.message ? err.message : 'Unable to create link.', true);
              } finally {
                signBtn.disabled = false;
              }
            });

            copyBtn.addEventListener('click', async () => {
              const ok = await copyText(linkInput.value, linkInput);
              setRowStatus(ok ? 'Copied.' : 'Copy failed.', !ok);
            });

            actionsWrap.appendChild(ttlWrap);
            actionsWrap.appendChild(signBtn);
            actionsWrap.appendChild(linkInput);
            actionsWrap.appendChild(pinLabel);
            actionsWrap.appendChild(copyBtn);
            actionsWrap.appendChild(openBtn);
            actionsWrap.appendChild(meta);
            actionsWrap.appendChild(rowStatus);
            actionsCell.appendChild(actionsWrap);
          } else {
            actionsCell.textContent = '-';
          }
          row.appendChild(actionsCell);

          tbody.appendChild(row);
        });
      };

      const updateTypeOptions = (types, selected) => {
        const currentValue = selected || typeSelect.value || '';
        while (typeSelect.options.length > 1) {
          typeSelect.remove(1);
        }
        types.forEach((type) => {
          const option = document.createElement('option');
          option.value = type;
          option.textContent = type.replace(/_/g, ' ');
          typeSelect.appendChild(option);
        });
        typeSelect.value = currentValue;
      };

      const updateAdminState = (user) => {
        const role = user ? (user.role || (user.isSuperadmin ? 'admin' : 'manager')) : '';
        isAdmin = Boolean(user && (user.isSuperadmin || role === 'admin'));
        canDeleteFiles = isAdmin || Boolean(user && user.canDeleteFiles);
        canGenerateLinks = isAdmin || Boolean(user && user.canGenerateLinks);

        if (adminActionsEl) {
          adminActionsEl.hidden = !canDeleteFiles;
        }
        if (filesTable) {
          filesTable.classList.toggle('is-admin', canDeleteFiles);
        }
        if (!canDeleteFiles) {
          selectedKeys = new Set();
        }
      };

      const loadUser = async () => {
        let hubUser = null;
        try {
          const response = await fetch('/api/status', { credentials: 'same-origin' });
          if (response.ok) {
            const payload = await response.json();
            hubUser = payload && payload.hub ? payload.hub.user : null;
          }
        } catch (err) {
          hubUser = null;
        }

        if (hubUser) {
          updateAdminState(hubUser);
          if (userMetaEl) {
            const role = hubUser.role || (hubUser.isSuperadmin ? 'admin' : 'manager');
            const label = role === 'blocked' ? 'no access' : role;
            userMetaEl.textContent = `Logged in as ${hubUser.username} (${label})`;
          }
          return;
        }

        const token = readAdminToken();
        if (!token) {
          updateAdminState(null);
          if (userMetaEl) userMetaEl.textContent = '';
          return;
        }

        try {
          const response = await fetchWithAdminToken('admin/profile', { credentials: 'same-origin' });
          if (!response.ok) throw new Error('admin profile failed');
          const payload = await response.json();
          if (!payload || !payload.ok) throw new Error('admin profile failed');
          const pseudoUser = { username: payload.username || 'admin', role: 'admin', isSuperadmin: true };
          updateAdminState(pseudoUser);
          if (userMetaEl) {
            userMetaEl.textContent = `Logged in as ${pseudoUser.username} (admin)`;
          }
        } catch (err) {
          updateAdminState(null);
          if (userMetaEl) userMetaEl.textContent = '';
        }
      };

      const getSelectedFiles = () => currentFiles.filter((file) => selectedKeys.has(fileKey(file)));

      const applySelection = (keys) => {
        selectedKeys = new Set(keys);
        renderRows(currentFiles);
      };

      const loadFiles = async () => {
        await loadUser();
        const filters = readFilters();
        updateQuery(filters);
        setStatus('Loading files...');

        const query = new URLSearchParams();
        if (filters.type) query.set('type', filters.type);
        if (filters.project) query.set('project', filters.project);
        if (filters.date) query.set('date', filters.date);
        if (filters.submitter) query.set('submitter', filters.submitter);
        if (filters.q) query.set('q', filters.q);
        if (filters.limit) query.set('limit', filters.limit);

        const url = buildAppUrl(`api/files${query.toString() ? `?${query}` : ''}`);
        try {
          const response = await fetch(url, { credentials: 'same-origin' });
          if (!response.ok) {
            throw new Error(`Request failed (${response.status})`);
          }
          const payload = await response.json();
          if (!payload.ok) {
            throw new Error('Server returned an error.');
          }
          updateTypeOptions(payload.types || [], filters.type);
          renderRows(payload.files || []);
          const total = payload.total || 0;
          const shown = (payload.files || []).length;
          resultsCountEl.textContent = `${shown} of ${total} files`;
          setStatus('Updated.');
        } catch (err) {
          renderRows([]);
          resultsCountEl.textContent = '0 files';
          setStatus(err && err.message ? err.message : 'Unable to load files.', true);
        }
      };

      if (selectAllBtn) {
        selectAllBtn.addEventListener('click', () => {
          if (!canDeleteFiles) return;
          applySelection(currentFiles.map(fileKey));
        });
      }
      if (clearSelectionBtn) {
        clearSelectionBtn.addEventListener('click', () => {
          if (!canDeleteFiles) return;
          applySelection([]);
        });
      }
      if (selectAllCheckbox) {
        selectAllCheckbox.addEventListener('change', () => {
          if (!canDeleteFiles) return;
          if (selectAllCheckbox.checked) {
            applySelection(currentFiles.map(fileKey));
          } else {
            applySelection([]);
          }
        });
      }
      if (downloadZipBtn) {
        downloadZipBtn.addEventListener('click', async () => {
          if (!canDeleteFiles) return;
          const selected = getSelectedFiles();
          if (!selected.length) return;
          setStatus('Preparing zip...');
          try {
            const response = await fetchWithAdminToken('api/files/zip', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                files: selected.map((file) => ({
                  templateType: file.templateType,
                  filename: file.filename
                }))
              }),
              credentials: 'same-origin'
            });
            if (!response.ok) {
              throw new Error(`Zip failed (${response.status})`);
            }
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            const ts = new Date().toISOString().replace(/[:.]/g, '-');
            link.href = url;
            link.download = `reports-${ts}.zip`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            URL.revokeObjectURL(url);
            setStatus('Zip ready.');
          } catch (err) {
            setStatus(err && err.message ? err.message : 'Unable to download zip.', true);
          }
        });
      }
      if (deleteFilesBtn) {
        deleteFilesBtn.addEventListener('click', async () => {
          if (!canDeleteFiles) return;
          const selected = getSelectedFiles();
          if (!selected.length) return;
          if (!confirm(`Delete ${selected.length} file(s)?`)) return;
          setStatus('Deleting files...');
          try {
            const response = await fetchWithAdminToken('api/files/delete', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                files: selected.map((file) => ({
                  templateType: file.templateType,
                  filename: file.filename
                }))
              }),
              credentials: 'same-origin'
            });
            if (!response.ok) {
              throw new Error(`Delete failed (${response.status})`);
            }
            const payload = await response.json();
            if (!payload.ok) {
              throw new Error('Delete failed.');
            }
            applySelection([]);
            await loadFiles();
            setStatus('Deleted.');
          } catch (err) {
            setStatus(err && err.message ? err.message : 'Unable to delete files.', true);
          }
        });
      }

      filtersForm.addEventListener('submit', (event) => {
        event.preventDefault();
        loadFiles();
      });
      refreshBtn.addEventListener('click', loadFiles);
      clearBtn.addEventListener('click', () => {
        typeSelect.value = '';
        projectInput.value = '';
        dateInput.value = '';
        submitterInput.value = '';
        queryInput.value = '';
        limitSelect.value = '200';
        loadFiles();
      });

      loadFiles();
    })();
  </script>
</body>

</html>
